name: tests

on: [push, pull_request]

jobs:
  exercises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # The original's own code checks its solution; a fork's code, pushed or in a pull request, its exercise notebook.
      - run: pytest
        env:
          MNIST_NOTEBOOK: ${{ (github.event.pull_request.head.repo.owner.login || github.repository_owner) == 'avidaldo' && 'mnist_numpy_solution.ipynb' || 'mnist_numpy.ipynb' }}
